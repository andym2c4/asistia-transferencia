[project]
name = "asistia"
version = "0.1.0"
description = "Importador de asistencia docente UGEL Luya (v2)"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "click>=8.1",
    "pypdf>=6.18.0",
    "flask>=3.1,<4",
    "waitress>=3,<4",
    "scikit-learn>=1.7,<2",
    "pillow>=11,<13",
]

[project.scripts]
asistia = "asistia.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.7",
]
reportes = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pandas>=3.0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asistia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
