<!doctype html><html lang="es"><head><script src="{{ url_for('static',filename='tema.js') }}"></script><script defer src="{{ url_for('static',filename='reporte_fuente.js') }}"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Original · ASISTIA</title><link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}"></head>
<body class="source-body"><main><form class="source-controls" method="get"><input type="hidden" name="vista" value="celdas"><label>Hoja<select name="hoja">{% for h in hojas %}<option value="{{ h }}" {% if h == hoja %}selected{% endif %}>{{ h }}</option>{% endfor %}</select></label><label>Desde fila<input name="fila" type="number" min="1" max="100000" value="{{ fila }}"></label><label>Desde columna<input name="columna" type="number" min="1" max="1000" value="{{ columna }}"></label><button>Ver celdas</button><label>Zoom<select data-source-zoom><option value=".8">80 %</option><option value="1" selected>100 %</option><option value="1.25">125 %</option><option value="1.5">150 %</option></select></label></form>
<p class="small muted">Celdas originales · {{ hoja }}. Desplaza para consultar 40 filas × 60 columnas; la apariencia de Excel puede variar.</p>
<div class="table-wrap" tabindex="0" aria-label="Celdas del documento original"><table class="source-table" data-source-content><thead><tr><th>Fila</th>{% for c in columnas %}<th>{{ c }}</th>{% endfor %}</tr></thead><tbody>{% for row in celdas %}{% set numero=fila+loop.index0 %}<tr><th>{{ numero }}</th>{% for cell in row %}<td{% if marcada and numero == marcada.fila and columna+loop.index0 == marcada.columna %} class="source-selected" aria-label="Celda seleccionada {{ marcada.celda }}"{% endif %}>{{ cell }}</td>{% endfor %}</tr>{% endfor %}</tbody></table></div></main></body></html>
