name: asistia_transferencia
services:
  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: asistia
      POSTGRES_PASSWORD: asistia_dev
      POSTGRES_DB: asistia_dev
    ports:
      - "127.0.0.1:5554:5432"
    volumes:
      - desarrollo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asistia -d asistia_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
  db_test:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: asistia
      POSTGRES_PASSWORD: asistia_test
      POSTGRES_DB: asistia_test_transferencia
    ports:
      - "127.0.0.1:5555:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asistia -d asistia_test_transferencia"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  desarrollo:
